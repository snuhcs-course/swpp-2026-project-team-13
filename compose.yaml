name: sori
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sori}
      POSTGRES_USER: ${POSTGRES_USER:-sori}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure backend/.env first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: db
    ports:
      - "8000:8000"
    volumes:
      - answer_data:/app/media
      - ./backend/.local:/app/.local
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  worker:
    build: ./backend
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: db
    command: ["python", "manage.py", "run_grading_worker"]
    volumes:
      - answer_data:/app/media
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  answer_data:
