name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sori
          POSTGRES_USER: sori
          POSTGRES_PASSWORD: ci-only-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sori -d sori"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-deployment-secret
      DJANGO_DEBUG: 'false'
      POSTGRES_DB: sori
      POSTGRES_USER: sori
      POSTGRES_PASSWORD: ci-only-database-password
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py migrate --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: python ../scripts/test_content.py
      - run: python ../scripts/test_engraving.py
      - run: python ../scripts/test_grading_contract.py
      - run: python ../scripts/test_playback.py
      - run: python ../scripts/test_audio_assets.py
      - run: python manage.py test api sori --noinput

  frontend:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned external instrument bank and license
        run: python3 scripts/fetch_soundfont.py
      - name: Test SORI API, MusicXML and transport contracts
        run: swift test --package-path frontend
      - name: Verify bundled piano audio
        run: swift frontend/scripts/check_piano.swift frontend/IPadApp/IPadApp/Resources/sori-piano-v1.sf2
      - name: Verify piano and count-in after repeated app audio graph rebuilds
        run: |
          mkdir -p build
          swiftc frontend/IPadApp/IPadApp/Services/PianoAudioGraph.swift frontend/scripts/audio-check/main.swift -o build/check-audio
          build/check-audio frontend/IPadApp/IPadApp/Resources
      - name: Build iPad app for simulator
        run: >-
          xcodebuild -project frontend/IPadApp/IPadApp.xcodeproj
          -scheme IPadApp -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build

      - name: Test comparison, voice settings and submission recovery on iPad simulator
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPad")))')
          set -o pipefail
          xcodebuild -project frontend/IPadApp/IPadApp.xcodeproj -scheme IPadApp -configuration Debug -destination "platform=iOS Simulator,id=$SIM_ID" -derivedDataPath build/DerivedData -resultBundlePath build/Comparison.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- -only-testing:IPadAppTests/IntegrationTests/testDemoReferenceAssetRoutesReturnPinnedPNGWithOrWithoutSlash -only-testing:IPadAppTests/IntegrationTests/testReferenceImagesAndCompactAnswerRenderTogether -only-testing:IPadAppTests/IntegrationTests/testVoiceSelectionPersistsAndCanPrepareNextProblem -only-testing:IPadAppTests/IntegrationTests/testRealAppFlowPrepareStartSubmitAndRestoreResult -only-testing:IPadAppTests/AuthenticationIntegrationTests test 2>&1 | tee build/ipad-tests.log
      - name: Upload comparison screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SORI-comparison-tests
          path: |
            build/Comparison.xcresult
            build/ipad-tests.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build unsigned iPad app for Windows installation
        if: github.event_name == 'push'
        run: >-
          xcodebuild -project frontend/IPadApp/IPadApp.xcodeproj
          -scheme IPadApp -configuration Debug -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build/Device
          ARCHS=arm64 CODE_SIGNING_ALLOWED=NO
          ENABLE_DEBUG_DYLIB=NO ENABLE_PREVIEWS=NO build
      - name: Verify device architecture and package IPA
        if: github.event_name == 'push'
        run: |
          xcrun lipo "build/Device/Build/Products/Debug-iphoneos/IPadApp.app/IPadApp" -verify_arch arm64
          python3 scripts/package-ipad.py --app build/Device/Build/Products/Debug-iphoneos/IPadApp.app
      - name: Upload iPad installation package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: SORI-iPad-install
          path: |
            dist/ipad/SORI-iPad-unsigned.ipa
            dist/ipad/INSTALL-WINDOWS.md
            dist/ipad/build-info.json
            dist/ipad/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
