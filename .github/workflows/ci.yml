name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sori
          POSTGRES_USER: sori
          POSTGRES_PASSWORD: ci-only-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sori -d sori"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-deployment-secret
      DJANGO_DEBUG: 'false'
      POSTGRES_DB: sori
      POSTGRES_USER: sori
      POSTGRES_PASSWORD: ci-only-database-password
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py migrate --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: python ../scripts/test_content.py
      - run: python ../scripts/test_playback.py
      - run: python manage.py test api sori --noinput

  frontend:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test SORI API, MusicXML and transport contracts
        run: swift test --package-path frontend
      - name: Verify bundled piano audio
        run: swift frontend/scripts/check_piano.swift frontend/IPadApp/IPadApp/Resources/sori-piano-v1.sf2
      - name: Build iPad app for simulator
        run: >-
          xcodebuild -project frontend/IPadApp/IPadApp.xcodeproj
          -scheme IPadApp -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
